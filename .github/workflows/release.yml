name: Release

# a tag (e.g. 0.1.0) builds and tests that version, publishes it to Maven Central, and creates a GitHub release with the
# CLI zip once Central has published it; publishing to Central can't be undone. Each step can be rerun: a version
# that's already on Central is skipped, and the GitHub release's files are replaced
on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  # checks the Windows launcher in the CLI zip before anything is published: it runs with Java 21, also from a
  # JAVA_HOME with spaces, and rejects Java 11 and a missing Java
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: java21
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build the CLI zip
        run: mvn -B package -DskipTests
      - uses: actions/setup-java@v6
        id: java11
        with:
          distribution: temurin
          java-version: 11
      - name: Run the launcher
        shell: pwsh
        env:
          JAVA21: ${{ steps.java21.outputs.path }}
          JAVA11: ${{ steps.java11.outputs.path }}
        run: |
          Expand-Archive -Path (Get-Item target/dnp3c-*.zip) -DestinationPath dist
          $cli = (Get-ChildItem dist)[0].FullName + "\bin\dnp3c.cmd"

          function Invoke-Cli($javaHome) {
            $env:JAVA_HOME = $javaHome
            $output = cmd /c "`"$cli`" -help 2>&1"
            $output | ForEach-Object { Write-Host $_ }
            return @{ Code = $LASTEXITCODE; Output = ($output -join "`n") }
          }

          $result = Invoke-Cli $env:JAVA21
          if ($result.Code -ne 0 -or $result.Output -notmatch 'usage:\s+dnp3c') { throw "the launcher failed" }

          # a JAVA_HOME with spaces, like C:\Program Files
          New-Item -ItemType Junction -Path "C:\Program Files\Java Under Test" -Target $env:JAVA21 | Out-Null
          $result = Invoke-Cli "C:\Program Files\Java Under Test"
          if ($result.Code -ne 0 -or $result.Output -notmatch 'usage:\s+dnp3c') { throw "the launcher failed with spaces in JAVA_HOME" }

          $result = Invoke-Cli $env:JAVA11
          if ($result.Code -eq 0) { throw "the launcher accepted Java 11" }

          $result = Invoke-Cli "C:\no java"
          if ($result.Code -eq 0) { throw "the launcher accepted a missing Java" }

          # the last case exits with 1 on purpose, which would otherwise fail this step
          exit 0

  release:
    needs: windows-launcher
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Set the version from the tag
        run: mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.17.1:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build and test
        run: mvn -B -P release verify
      # as in CI: the dependencies' licenses must be the reviewed ones
      - name: Check the dependencies' licenses are committed
        run: |
          if [ -n "$(git status --porcelain -- src/license)" ]; then
            git status --porcelain -- src/license
            echo "A dependency's license changed: review src/license/texts and commit it"
            exit 1
          fi
      # the release notes are the version's section of CHANGELOG.md; a release candidate (0.2.0-RC1) uses its
      # version's (0.2.0). Taken before publishing, so a missing section stops the release before anything is published
      - name: Take the release notes from the changelog
        run: |
          base="${VERSION%%-*}"
          awk -v v="$base" '$0 == "## " v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $base"
            exit 1
          fi
      - name: Import the PGP key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.SFIO_PGP_PRIVATE_KEY }}
          passphrase: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
      - name: Publish to Maven Central
        env:
          FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PASSPHRASE: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: ./.github/central-bundle.sh && ./.github/central-upload.sh
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            target/dnp3c-${{ github.ref_name }}.zip
            target/dnp3c-${{ github.ref_name }}-cli.jar
          prerelease: ${{ contains(github.ref_name, '-') }}
