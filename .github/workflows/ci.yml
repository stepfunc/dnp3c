name: CI

# pull requests only: main is protected, and these checks must pass on an up-to-date branch before merging
on:
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check formatting and license headers
        run: mvn -B spotless:check

  test:
    name: test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B verify
      # the build downloads the license of a new dependency into src/license/texts, to be reviewed and committed
      - name: Check the dependencies' licenses are committed
        run: |
          if [ -n "$(git status --porcelain -- src/license)" ]; then
            git status --porcelain -- src/license
            echo "A dependency's license changed: review src/license/texts and commit it"
            exit 1
          fi

  # runs the CLI zip's launcher with Java 21, and checks it rejects Java 11 and a missing Java
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: java21
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build the CLI zip
        run: mvn -B package -DskipTests
      - uses: actions/setup-java@v6
        id: java11
        with:
          distribution: temurin
          java-version: 11
      - name: Run the launcher
        if: runner.os != 'Windows'
        shell: bash
        env:
          JAVA21: ${{ steps.java21.outputs.path }}
          JAVA11: ${{ steps.java11.outputs.path }}
        run: |
          unzip -q target/dnp3c-*.zip -d dist
          cd dist/dnp3c-*/
          JAVA_HOME="$JAVA21" ./bin/dnp3c -help | tee help.txt
          grep -qE 'usage: +dnp3c' help.txt
          if JAVA_HOME="$JAVA11" ./bin/dnp3c -help; then echo "accepted Java 11"; exit 1; fi
          if JAVA_HOME="$PWD/none" ./bin/dnp3c -help; then echo "accepted a missing Java"; exit 1; fi
      - name: Run the launcher
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JAVA21: ${{ steps.java21.outputs.path }}
          JAVA11: ${{ steps.java11.outputs.path }}
        run: |
          Expand-Archive -Path (Get-Item target/dnp3c-*.zip) -DestinationPath dist
          $cli = (Get-ChildItem dist)[0].FullName + "\bin\dnp3c.cmd"

          function Invoke-Cli($javaHome) {
            $env:JAVA_HOME = $javaHome
            $output = cmd /c "`"$cli`" -help 2>&1"
            $output | ForEach-Object { Write-Host $_ }
            return @{ Code = $LASTEXITCODE; Output = ($output -join "`n") }
          }

          $result = Invoke-Cli $env:JAVA21
          if ($result.Code -ne 0 -or $result.Output -notmatch 'usage:\s+dnp3c') { throw "the launcher failed" }

          # a JAVA_HOME with spaces, like C:\Program Files
          New-Item -ItemType Junction -Path "C:\Program Files\Java Under Test" -Target $env:JAVA21 | Out-Null
          $result = Invoke-Cli "C:\Program Files\Java Under Test"
          if ($result.Code -ne 0 -or $result.Output -notmatch 'usage:\s+dnp3c') { throw "the launcher failed with spaces in JAVA_HOME" }

          $result = Invoke-Cli $env:JAVA11
          if ($result.Code -eq 0) { throw "the launcher accepted Java 11" }

          $result = Invoke-Cli "C:\no java"
          if ($result.Code -eq 0) { throw "the launcher accepted a missing Java" }

          # the last case exits with 1 on purpose, which would otherwise fail this step
          exit 0
