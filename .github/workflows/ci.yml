name: CI

# pull requests, and the merge queue: main is protected, and a pull request merges through the queue, which runs
# these checks on it together with main and the pull requests ahead of it
on:
  pull_request:
  merge_group:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check formatting and license headers
        run: mvn -B spotless:check

  test:
    name: test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B verify
      # the build downloads the license of a new dependency into src/license/texts, to be reviewed and committed
      - name: Check the dependencies' licenses are committed
        run: |
          if [ -n "$(git status --porcelain -- src/license)" ]; then
            git status --porcelain -- src/license
            echo "A dependency's license changed: review src/license/texts and commit it"
            exit 1
          fi

  # runs the CLI zip's launcher with Java 21, and checks it rejects Java 11 and a missing Java. The Windows launcher is
  # checked before each release (release.yml), as it rarely changes
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: java21
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build the CLI zip
        run: mvn -B package -DskipTests
      - uses: actions/setup-java@v6
        id: java11
        with:
          distribution: temurin
          java-version: 11
      - name: Run the launcher
        shell: bash
        env:
          JAVA21: ${{ steps.java21.outputs.path }}
          JAVA11: ${{ steps.java11.outputs.path }}
        run: |
          unzip -q target/dnp3c-*.zip -d dist
          cd dist/dnp3c-*/
          JAVA_HOME="$JAVA21" ./bin/dnp3c -help | tee help.txt
          grep -qE 'usage: +dnp3c' help.txt
          if JAVA_HOME="$JAVA11" ./bin/dnp3c -help; then echo "accepted Java 11"; exit 1; fi
          if JAVA_HOME="$PWD/none" ./bin/dnp3c -help; then echo "accepted a missing Java"; exit 1; fi
